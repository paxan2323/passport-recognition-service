worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 10m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP — ACME challenge + redirect to HTTPS
    server {
        listen 8080;
        server_name pass.hermes-support.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — API
    server {
        listen 8443 ssl;
        http2 on;
        server_name pass.hermes-support.ru;

        ssl_certificate /etc/letsencrypt/live/pass.hermes-support.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pass.hermes-support.ru/privkey.pem;
        ssl_session_timeout 1d;
        ssl_protocols TLSv1.2 TLSv1.3;

        set $api_upstream api:8000;

        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 130s;
            proxy_connect_timeout 5s;
        }

        location /health {
            proxy_pass http://$api_upstream/health;
        }

        location /ready {
            proxy_pass http://$api_upstream/ready;
        }
    }
}
