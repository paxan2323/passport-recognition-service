# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  api:
    volumes: []
    restart: unless-stopped

  worker:
    volumes:
      - /var/lib/docreader/models:/tmp/docreader-cache/models:ro
    environment:
      REGPAGE_WEIGHTS_PATH: /tmp/docreader-cache/models/regpage_obb.pt
    restart: unless-stopped

  nginx:
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:8080"
      - "443:8443"
    restart: unless-stopped

  prometheus:
    ports:
      - "127.0.0.1:19090:9090"

  grafana:
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
