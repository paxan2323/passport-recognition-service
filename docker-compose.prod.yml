# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  redis:
    restart: unless-stopped

  api:
    volumes: []
    restart: unless-stopped

  worker:
    volumes:
      - /var/lib/docreader/models:/tmp/docreader-cache/models:ro
      - /var/lib/docreader/easyocr-en:/tmp/docreader-cache/easyocr-en
    environment:
      REGPAGE_WEIGHTS_PATH: /tmp/docreader-cache/models/regpage_obb.pt
      EASYOCR_MODULE_PATH: /tmp/docreader-cache/easyocr-en
      EASYOCR_REG_PATH: /tmp/docreader-cache/easyocr-en
    restart: unless-stopped

  nginx:
    ports:
      - "80:8080"
    restart: unless-stopped

  prometheus:
    ports:
      - "127.0.0.1:19090:9090"

  grafana:
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
