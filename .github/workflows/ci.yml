name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-service.txt

      - name: Install dependencies
        run: pip install -r requirements-service.txt

      - name: Postprocess unit tests
        run: python tests/test_postprocess.py

      - name: Service unit tests
        run: pytest tests/test_service.py tests/test_main_only.py -v

      - name: Service lifecycle tests
        run: pytest tests/test_service_lifecycle.py -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: true

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR=/opt/passport-recognition-service
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh scripts/setup-ssl.sh
            if [ ! -f /etc/letsencrypt/live/pass.hermes-support.ru/fullchain.pem ]; then
              bash scripts/setup-ssl.sh
            fi
            bash scripts/deploy.sh

      - name: Verify public health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://pass.hermes-support.ru/health"; then
              exit 0
            fi
            if curl -fsS "http://${{ secrets.DEPLOY_HOST }}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Public health check failed"
          exit 1
